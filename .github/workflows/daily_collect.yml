name: Daily weather collection

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Append daily observations
        run: python scripts/append_daily.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/history.csv
          git diff --staged --quiet || git commit -m "data: append $(date +%Y-%m-%d)"
          git push
